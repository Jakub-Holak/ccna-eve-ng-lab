version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
ip dhcp excluded-address 172.16.0.1 172.16.0.2
ip dhcp excluded-address 172.16.1.1 172.16.1.2
!
ip dhcp pool POOL_VLAN10
 network 172.16.0.0 255.255.255.0
 default-router 172.16.0.1
 dns-server 8.8.8.8
!
ip dhcp pool POOL_VLAN20
 network 172.16.1.0 255.255.255.192
 default-router 172.16.1.1
 dns-server 8.8.8.8
!
!
!
ip domain name lab.local
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
redundancy
!
!
!
!
!
!
interface Loopback0
 ip address 8.8.8.8 255.255.255.255
 shutdown
!
interface GigabitEthernet0/0
 ip address 172.16.1.113 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1.10
 encapsulation dot1Q 10
 ip address 172.16.0.1 255.255.255.0
 ip access-group BLOCK_USERS_TO_SERVICES in
 ip nat inside
 ip virtual-reassembly in
!
interface GigabitEthernet0/1.20
 encapsulation dot1Q 20
 ip address 172.16.1.1 255.255.255.192
 ip nat inside
 ip virtual-reassembly in
!
interface GigabitEthernet0/1.30
 encapsulation dot1Q 30
 ip address 172.16.1.65 255.255.255.224
!
interface GigabitEthernet0/1.99
 encapsulation dot1Q 99 native
 ip address 172.16.1.97 255.255.255.240
!
interface GigabitEthernet0/2
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 ip virtual-reassembly in
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 172.16.0.0 0.0.0.255 area 0
 network 172.16.1.0 0.0.0.63 area 0
 network 172.16.1.64 0.0.0.31 area 0
 network 172.16.1.96 0.0.0.15 area 0
 network 172.16.1.113 0.0.0.0 area 0
 default-information originate
!
ip forward-protocol nd
!
!
no ip http server
ip nat inside source list 1 interface GigabitEthernet0/2 overload
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
ip access-list extended BLOCK
 deny   ip 172.16.0.0 0.0.0.255 172.16.1.64 0.0.0.31
ip access-list extended BLOCK_USERS_TO_SERVICES
 deny   ip 172.16.0.0 0.0.0.255 172.16.1.64 0.0.0.31
 permit ip any any
!
ipv6 ioam timestamp
!
!
access-list 1 permit 172.16.0.0 0.0.3.255
!
control-plane
!
line con 0
line aux 0
line vty 0 4
 login
 transport input none
!
no scheduler allocate
ntp master 2
!
end
